<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131" role="img" aria-labelledby="title desc">
  <title id="title">ロボットチャンバラ展示の体験進行</title>
  <desc id="desc">構える、剣を交える、隙ができる、一撃を決める、という4場面の絵コンテ。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173B55" flood-opacity=".10"/></filter></defs>
  <rect width="1600" height="1131" fill="#F4F7FA"/>
  <rect x="0" y="0" width="18" height="1131" fill="#F2B84B"/>
  <g font-family="'Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
    <text x="70" y="92" font-size="46" font-weight="800" fill="#173B55">遊び方は、4つだけ。</text>
    <text x="70" y="140" font-size="24" fill="#52637A">画面を見続けなくても、剣・音・光で次の行動が分かる体験を目指します。</text>

    <!-- card 1 -->
    <g transform="translate(70 195)" filter="url(#shadow)">
      <rect width="340" height="564" rx="26" fill="#FFFFFF"/>
      <rect width="340" height="74" rx="26" fill="#173B55"/><path d="M0 48 H340 V74 H0Z" fill="#173B55"/>
      <text x="30" y="49" font-size="24" font-weight="800" fill="#F7C85C">01</text><text x="78" y="49" font-size="28" font-weight="800" fill="#FFFFFF">構える</text>
      <rect x="22" y="96" width="296" height="290" rx="18" fill="#F3F8FB"/>
      <circle cx="105" cy="166" r="24" fill="#E4F3FB" stroke="#1779B0" stroke-width="5"/>
      <path d="M105 192 V272 M105 222 L64 251 M105 222 L150 246 M105 272 L72 346 M105 272 L142 346 M150 246 L220 164" fill="none" stroke="#1779B0" stroke-width="10" stroke-linecap="round"/>
      <circle cx="244" cy="321" r="24" fill="#FBE3DD" stroke="#D77E66" stroke-width="3"/><path d="M244 345 V363 M228 363 H260" stroke="#D77E66" stroke-width="3"/>
      <text x="170" y="426" font-size="24" text-anchor="middle" font-weight="800" fill="#173B55">ロボットに向き合う</text>
      <text x="170" y="467" font-size="19" text-anchor="middle" fill="#52637A">紙風船を守る位置で、</text><text x="170" y="497" font-size="19" text-anchor="middle" fill="#52637A">スポンジ剣を構える。</text>
      <rect x="26" y="519" width="288" height="36" rx="18" fill="#DCEEF8"/><text x="170" y="544" font-size="18" text-anchor="middle" font-weight="700" fill="#176B99">「相手の剣を受けよう」</text>
    </g>

    <!-- card 2 -->
    <g transform="translate(443 195)" filter="url(#shadow)">
      <rect width="340" height="564" rx="26" fill="#FFFFFF"/>
      <rect width="340" height="74" rx="26" fill="#1779B0"/><path d="M0 48 H340 V74 H0Z" fill="#1779B0"/>
      <text x="30" y="49" font-size="24" font-weight="800" fill="#FFFFFF">02</text><text x="78" y="49" font-size="28" font-weight="800" fill="#FFFFFF">剣を交える</text>
      <rect x="22" y="96" width="296" height="290" rx="18" fill="#F3F8FB"/>
      <circle cx="80" cy="180" r="22" fill="#E4F3FB" stroke="#1779B0" stroke-width="5"/>
      <path d="M80 205 V286 M80 226 L43 255 M80 226 L124 248 M80 286 L53 346 M80 286 L111 346 M124 248 L210 187" fill="none" stroke="#1779B0" stroke-width="9" stroke-linecap="round"/>
      <rect x="261" y="326" width="45" height="15" rx="4" fill="#9AA8BA"/><path d="M283 324 L283 276 L250 244 L223 196" fill="none" stroke="#73849A" stroke-width="18" stroke-linecap="round"/><path d="M223 196 L154 217" fill="none" stroke="#73849A" stroke-width="10" stroke-linecap="round"/>
      <path d="M174 205 l14 -5 -3 -14 11 10 12 -10 -4 14 15 5 -15 5 4 15 -12 -11 -11 11 3 -15 Z" fill="#F7C85C" stroke="#B56F0D" stroke-width="2"/>
      <text x="170" y="426" font-size="24" text-anchor="middle" font-weight="800" fill="#173B55">自分の剣で受ける</text>
      <text x="170" y="467" font-size="19" text-anchor="middle" fill="#52637A">音や光に合わせて受ける。</text><text x="170" y="497" font-size="19" text-anchor="middle" fill="#52637A">成功すると相手の剣が後退。</text>
      <rect x="26" y="519" width="288" height="36" rx="18" fill="#DCEEF8"/><text x="170" y="544" font-size="18" text-anchor="middle" font-weight="700" fill="#176B99">「剣で受けて！」→「受けた！」</text>
    </g>

    <!-- card 3 -->
    <g transform="translate(816 195)" filter="url(#shadow)">
      <rect width="340" height="564" rx="26" fill="#FFFFFF"/>
      <rect width="340" height="74" rx="26" fill="#C98920"/><path d="M0 48 H340 V74 H0Z" fill="#C98920"/>
      <text x="30" y="49" font-size="24" font-weight="800" fill="#FFFFFF">03</text><text x="78" y="49" font-size="28" font-weight="800" fill="#FFFFFF">隙ができる</text>
      <rect x="22" y="96" width="296" height="290" rx="18" fill="#FFF9E9"/>
      <circle cx="70" cy="240" r="33" fill="#E5E9ED" stroke="#8A96A4" stroke-width="4"/><circle cx="70" cy="240" r="17" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="170" cy="240" r="51" fill="#FCE29A" opacity=".6"/><circle cx="170" cy="240" r="36" fill="#F7C85C" stroke="#B77918" stroke-width="4"/><circle cx="170" cy="240" r="18" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="270" cy="240" r="33" fill="#E5E9ED" stroke="#8A96A4" stroke-width="4"/><circle cx="270" cy="240" r="17" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M170 178 V158 M170 322 V302 M131 201 L117 187 M209 201 L223 187" stroke="#D89B2E" stroke-width="5" stroke-linecap="round"/>
      <text x="170" y="350" font-size="19" text-anchor="middle" fill="#52637A">3つから、ランダムに1つ</text>
      <text x="170" y="426" font-size="24" text-anchor="middle" font-weight="800" fill="#173B55">攻撃のチャンス</text>
      <text x="170" y="467" font-size="19" text-anchor="middle" fill="#52637A">光った弱点を見つけて、</text><text x="170" y="497" font-size="19" text-anchor="middle" fill="#52637A">そこへ移動する。</text>
      <rect x="26" y="519" width="288" height="36" rx="18" fill="#FFF0C9"/><text x="170" y="544" font-size="18" text-anchor="middle" font-weight="700" fill="#9A6111">「光ったところを叩いて！」</text>
    </g>

    <!-- card 4 -->
    <g transform="translate(1189 195)" filter="url(#shadow)">
      <rect width="340" height="564" rx="26" fill="#FFFFFF"/>
      <rect width="340" height="74" rx="26" fill="#D36950"/><path d="M0 48 H340 V74 H0Z" fill="#D36950"/>
      <text x="30" y="49" font-size="24" font-weight="800" fill="#FFFFFF">04</text><text x="78" y="49" font-size="28" font-weight="800" fill="#FFFFFF">一撃を決める</text>
      <rect x="22" y="96" width="296" height="290" rx="18" fill="#FCF5F3"/>
      <circle cx="76" cy="183" r="22" fill="#E4F3FB" stroke="#1779B0" stroke-width="5"/><path d="M76 208 V290 M76 229 L40 260 M76 229 L125 245 M76 290 L50 346 M76 290 L107 346 M125 245 L230 270" fill="none" stroke="#1779B0" stroke-width="9" stroke-linecap="round"/>
      <circle cx="235" cy="270" r="43" fill="#FCE29A" opacity=".7"/><circle cx="235" cy="270" r="29" fill="#F7C85C" stroke="#B77918" stroke-width="4"/><path d="M217 270 l12 -4 -3 -12 10 9 10 -9 -3 12 12 4 -12 4 3 12 -10 -9 -10 9 3 -12 Z" fill="#FFFFFF" stroke="#B77918" stroke-width="2"/>
      <text x="170" y="426" font-size="24" text-anchor="middle" font-weight="800" fill="#173B55">成果を一撃にする</text>
      <text x="170" y="467" font-size="19" text-anchor="middle" fill="#52637A">点灯中に叩いて1ダメージ。</text><text x="170" y="497" font-size="19" text-anchor="middle" fill="#52637A">合計3回の命中で勝利！</text>
      <rect x="26" y="519" width="288" height="36" rx="18" fill="#FBE3DD"/><text x="170" y="544" font-size="18" text-anchor="middle" font-weight="700" fill="#A9513F">命中音＋HP減少</text>
    </g>

    <path d="M410 477 H443 M783 477 H816 M1156 477 H1189" stroke="#A6B4C3" stroke-width="5"/>
    <path d="M432 467 L443 477 L432 487 M805 467 L816 477 L805 487 M1178 467 L1189 477 L1178 487" fill="none" stroke="#A6B4C3" stroke-width="5" stroke-linecap="round"/>

    <rect x="70" y="805" width="950" height="226" rx="24" fill="#FFFFFF" stroke="#D7E0E8" stroke-width="2"/>
    <text x="105" y="854" font-size="25" font-weight="800" fill="#173B55">基本ルール：守って、3回決める</text>
    <circle cx="117" cy="900" r="6" fill="#F2B84B"/><text x="140" y="908" font-size="21" fill="#35485F">音や光に合わせて受ける → 3つの弱点から1つが光る。</text>
    <circle cx="117" cy="944" r="6" fill="#F2B84B"/><text x="140" y="952" font-size="21" fill="#35485F">HPは3。命中ごとに1減り、難易度が上がる。</text>
    <circle cx="117" cy="988" r="6" fill="#F2B84B"/><text x="140" y="996" font-size="21" fill="#35485F">HP0で人の勝利。紙風船を割られたら人の敗北。</text>

    <rect x="1050" y="805" width="479" height="226" rx="24" fill="#173B55"/>
    <text x="1085" y="854" font-size="22" font-weight="800" fill="#F7C85C">この会議で合意したいこと</text>
    <text x="1085" y="904" font-size="23" font-weight="800" fill="#FFFFFF">〈受ける → 隙をつくる</text>
    <text x="1085" y="942" font-size="23" font-weight="800" fill="#FFFFFF">　→ 一撃を決める〉</text>
    <text x="1085" y="983" font-size="19" fill="#DDE7EE">この体験を中心に試作を進めたい。</text>

    <text x="70" y="1070" font-size="16" fill="#718096">初期試作は数歩の移動と点灯時間で調整。実機の高速化は前提にしない。後退・認識・音との同期は担当者と確認する。</text>
    <text x="1530" y="1102" font-size="17" text-anchor="end" fill="#718096">原案反映版 / 02</text>
  </g>
</svg>
